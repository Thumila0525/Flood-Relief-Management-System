<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Flood Relief Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <h1>⛑️ Flood Relief Management System</h1>
        <div>
            <span id="userName"></span>
            <button onclick="logout()" class="btnsmall">Logout</button>
        </div>
    </div>

    <div class="dashbord">
        <div class="header">
            <h2>My Relief Requests</h2>
            <button onclick="showAddForm()" class="btn" style="width:auto;">+ New Request</button>
        </div>

        <div id="requestsList"></div>

        <div id="noRequests" class="no-data" style="display:none;">
            <p>You haven't submitted any requests yet.</p>
            <button onclick="showAddForm()" class="btn" style="width:auto;">Submit First Request</button>
        </div>
    
    </div>


    <!-- Popup Request -->
    <div id="requestPopup" class="popup">
        <div class="popupcontent">
            <h2 id="popupTitle">New Relief Request</h2>
            <span class="close" onclick="closePopup()">&times;</span>

            <form id="requestForm">
                <input type="hidden" id="requestId">

                <div class="form">
                    <label>Type of Relief</label>
                    <select id="reliefType" required>
                        <option value="">Select Type</option>
                        <option value="Food">Food</option>
                        <option value="Water">Water</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Shelter">Shelter</option>
                    </select>
                </div>

                <div class="form">
                    <label>Severity Level</label>
                    <select id="severity" required>
                        <option value="">Select Severity</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="form">
                    <label>District</label>
                    <select id="district" required>
                        <option value="">Select District</option>
                        <option value="Ampara">Ampara</option>
                        <option value="Anuradhapura">Anuradhapura</option>
                        <option value="Badulla">Badulla</option>
                        <option value="Batticaloa">Batticaloa</option>
                        <option value="Colombo">Colombo</option>
                        <option value="Galle">Galle</option>
                        <option value="Gampaha">Gampaha</option>
                        <option value="Hambanthota">Hambanthota</option>
                        <option value="Jaffna">Jaffna</option>
                        <option value="Kalutara">Kalutara</option>
                        <option value="Kandy">Kandy</option>
                        <option value="Kegalle">Kegalle</option>
                        <option value="Kilinochchi">Kilinochchi</option>
                        <option value="Kurunegala">Kurunegala</option>
                        <option value="Mannar">Mannar</option>
                        <option value="Matale">Matale</option>
                        <option value="Matara">Matara</option>
                        <option value="Monaragala">Monaragala</option>
                        <option value="Mulathiv">Mulathiv</option>
                        <option value="Nuwalaeliya">Nuwalaeliya</option>
                        <option value="Polonnaruwa">Polonnaruwa</option>
                        <option value="Puthtalam">Puthtalam</option>
                        <option value="Ratnapura">Ratnapura</option>
                        <option value="Trincomalee">Trincomalee</option>
                        <option value="Vavuniya">Vavuniya</option>
                    </select>
                </div>


                <div class="form">
                    <label>Divisional Secretariat</label>
                    <input type="text" id="dsDivision" required>
                </div>

                <div class="form">
                    <label>Grama Niladhari Division</label>
                    <input type="text" id="gnDivision" required>
                </div>

                <h3>Household Details</h3>

                <div class="form">
                    <label>Contact Person Name</label>
                    <input type="text" id="contactPerson" required>
                </div>

                <div class="form">
                    <label>Contact Number</label>
                    <input type="text" id="contactNumber" required>
                </div>

                <div class="form">
                    <label>Address</label>
                    <textarea id="houseAddress" rows="3" required></textarea>
                </div>

                <div class="form">
                    <label>Number of Family Members</label>
                    <input type="number" id="familyMembers" min="1" required>
                </div>

                <div class="form">
                    <label>Special Requirements</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div id="formError" class="errormsg" style="display:none;"></div>
                <div id="formSuccess" class="successmsg" style="display:none;"></div>

                <div class="formbuttons">
                    <button type="button" onclick="closePopup()" class="btncc">Cancel</button>
                    <button type="submit" class="btn" style="width:auto;">Submit</button>
                </div>
  
            </form>

        </div>
    </div>



        <script src="dashbord.js"></script>
</body>
</html>
